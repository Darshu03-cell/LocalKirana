name: Deploy to Hostinger (FTP)

# Auto-deploys the site to Hostinger every time you push to `main`.
# You can also run it by hand from the GitHub "Actions" tab (workflow_dispatch).
#
# ONE-TIME SETUP — add these secrets in GitHub:
#   Repo → Settings → Secrets and variables → Actions → "New repository secret"
#     FTP_SERVER           = your FTP host   (Hostinger hPanel → Files → FTP Accounts, e.g. ftp.kirana.meriise.org or an IP)
#     FTP_USERNAME         = your FTP user   (from the same FTP Accounts page)
#     FTP_PASSWORD         = your FTP password
#   For online payments (optional until you're ready — Cash on Delivery works without them):
#     RAZORPAY_KEY_ID      = your Razorpay Key ID     (rzp_test_... or rzp_live_...)
#     RAZORPAY_KEY_SECRET  = your Razorpay Key Secret
#   The secret key is written to includes/config.local.php on deploy and uploaded to
#   the server, but is NEVER committed to git (so it stays out of the public repo).
#
# KNOWN ISSUE (diagnosed 2026-10-16): the FTP account these secrets point to is
#   NOT the location that serves kirana.meriise.org. A probe uploaded marker files
#   (via this same working action) into ./ , public_html/ , public_html/kirana/ ,
#   kirana/ , and domains/kirana.meriise.org/public_html/ — ALL uploads succeeded,
#   but NONE became visible at kirana.meriise.org or meriise.org. Meanwhile the
#   live site's existing files (index.php, login.php, …) are served fine. So no
#   server-dir value can fix this: the FTP credentials themselves reach the wrong
#   account/filesystem. The live site is being updated by other means (manual
#   File Manager upload to the correct account).
#
#   TO FIX auto-deploy: in Hostinger hPanel → Files → FTP Accounts, find (or create)
#   the FTP account whose directory IS the kirana.meriise.org document root (the
#   folder that already contains index.php), and set FTP_SERVER / FTP_USERNAME /
#   FTP_PASSWORD to THAT account. A domain-scoped FTP account opens directly in its
#   docroot, so server-dir: ./ is then correct.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Write the Razorpay keys into a local config file (git-ignored) so they ship
      # to the server without ever being committed. GitHub masks secret values in
      # logs. If the secrets aren't set yet, empty keys are written and the site
      # simply falls back to Cash on Delivery until you add them.
      - name: Write Razorpay keys for production
        env:
          RZP_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RZP_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
        run: |
          {
            echo '<?php'
            echo '// Generated at deploy time from GitHub Actions secrets. Do not edit by hand.'
            echo 'return ['
            echo "  'razorpay_key_id'     => '${RZP_ID}',"
            echo "  'razorpay_key_secret' => '${RZP_SECRET}',"
            echo '];'
          } > includes/config.local.php

      - name: Upload files to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./
          # Never overwrite the live database / sessions or repo meta files.
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            data/**
            **/*.sqlite
            README.md
            LICENSE
            ATTRIBUTIONS.md
