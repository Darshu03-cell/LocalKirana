<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#16a34a" />
  <title>You're offline – Local Kirana Connect</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           font-family: Inter, system-ui, 'Segoe UI', sans-serif; background: #f9fafb; color: #111827; padding: 16px; box-sizing: border-box; }
    .card { max-width: 360px; text-align: center; background: #fff; border-radius: 16px; padding: 32px 24px; box-shadow: 0 4px 20px rgba(0,0,0,.06); }
    img { width: 72px; height: 72px; border-radius: 16px; }
    h1 { font-size: 20px; margin: 16px 0 8px; }
    p { color: #6b7280; font-size: 14px; line-height: 1.5; margin: 0 0 20px; }
    button { background: #16a34a; color: #fff; border: 0; border-radius: 10px; padding: 12px 20px; font-size: 15px; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <img src="icons/icon-192.png" alt="" />
    <h1>You're offline</h1>
    <p>Local Kirana needs the internet to show stores, your cart and orders. Check your connection and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
